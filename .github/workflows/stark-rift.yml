name: Stark Rift and Paperoid regression

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: stark-rift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:stark-rift-lab
      - run: npm run bench:stark-rift
      - uses: actions/checkout@v4
        with:
          ref: a134c98d21d3f63b4eed710a42ada83a0e979701
          path: work/stark-rift-lab/baseline
          persist-credentials: false
      - run: node tools/stark-rift-lab/compare-baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stark-rift-performance
          path: |
            work/stark-rift-lab/benchmark.json
            work/stark-rift-lab/equivalence.json
